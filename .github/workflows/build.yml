name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore src/AwesomeRpaUtils.sln
      - name: Build
        run: dotnet build src/AwesomeRpaUtils.sln --configuration Release --no-restore
      - name: Test
        # Runs every test project in the solution against the Release build above. A failing test fails the build.
        run: dotnet test src/AwesomeRpaUtils.sln --configuration Release --no-build --maxcpucount:1 --logger "trx;LogFileNamePrefix=ci" --results-directory test-results
      - name: Test (REST code generator)
        # Not part of the solution, so it needs its own step.
        run: dotnet test tools/RestCodeGenerator.Tests/RestCodeGenerator.Tests.csproj --configuration Release --logger "trx;LogFileNamePrefix=ci-restcodegenerator" --results-directory test-results
      - name: Build REST code generator and Component Browser (Release)
        # Neither is in the solution. The Component Browser's end-to-end test runs Package-Release.ps1 -NoBuild,
        # which stages both from their Release output, exactly as the release workflow builds them.
        run: |
          dotnet build tools/RestCodeGenerator/RestCodeGenerator.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build component-browser/ComponentBrowser.csproj --configuration Release
      - name: Test (Component Browser)
        # Not part of the solution either.
        run: dotnet test component-browser/ComponentBrowser.Tests/ComponentBrowser.Tests.csproj --configuration Release --logger "trx;LogFileNamePrefix=ci-componentbrowser" --results-directory test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.trx
          if-no-files-found: ignore
      - name: Pack NuGet packages (dry run)
        # Proves on every pull request to main and every push to main that all components still pack, so a
        # packaging problem is found here rather than while cutting a release.
        shell: pwsh
        run: ./scripts/Pack-NuGet.ps1 -Configuration Release -Version 0.0.0-ci -NoBuild
