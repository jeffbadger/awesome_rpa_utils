name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore src/AwesomeRpaUtils.sln
      - name: Build
        run: dotnet build src/AwesomeRpaUtils.sln --configuration Release --no-restore
      - name: Build RestCodeGenerator
        # Lives outside src/AwesomeRpaUtils.sln, so the solution build above never
        # produces it; Package-Release.ps1 -NoBuild expects this output to already exist.
        run: dotnet build tools/RestCodeGenerator/RestCodeGenerator.csproj --configuration Release
      - name: Build ComponentBrowser
        # Also lives outside src/AwesomeRpaUtils.sln. A plain build already produces a
        # runnable ComponentBrowser.exe apphost here since this runs on windows-latest.
        run: dotnet build component-browser/ComponentBrowser.csproj --configuration Release
      - name: Package project DLLs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/Package-Release.ps1 `
            -Configuration Release `
            -NoBuild `
            -ArchivePath "AwesomeRpaUtils-{tfm}-$env:RELEASE_TAG.zip"
      - name: Package documentation
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/Package-Documentation.ps1 `
            -ArchivePath "AwesomeRpaUtils-Documentation-$env:RELEASE_TAG.zip"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AwesomeRpaUtils-net8.0-${{ github.ref_name }}.zip
            AwesomeRpaUtils-net10.0-${{ github.ref_name }}.zip
            AwesomeRpaUtils-Documentation-${{ github.ref_name }}.zip
