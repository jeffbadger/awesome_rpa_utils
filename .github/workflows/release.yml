name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore src/AwesomeRpaUtils.sln
      - name: Build
        run: dotnet build src/AwesomeRpaUtils.sln --configuration Release --no-restore
      - name: Package project DLLs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/Package-Release.ps1 `
            -Configuration Release `
            -NoBuild `
            -ArchivePath "AwesomeRpaUtils-{tfm}-$env:RELEASE_TAG.zip" `
            -SupportArchivePath "AwesomeRpaUtils-SupportLibraries-$env:RELEASE_TAG.zip"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AwesomeRpaUtils-net8.0-${{ github.ref_name }}.zip
            AwesomeRpaUtils-net10.0-${{ github.ref_name }}.zip
            AwesomeRpaUtils-SupportLibraries-${{ github.ref_name }}.zip
