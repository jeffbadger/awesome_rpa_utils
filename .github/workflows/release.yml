name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/AwesomeRpaUtils.sln
      - name: Build
        run: dotnet build src/AwesomeRpaUtils.sln --configuration Release --no-restore
      - name: Zip build output
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path src/bin/Release/* -DestinationPath "AwesomeRpaUtils-$env:RELEASE_TAG.zip"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: AwesomeRpaUtils-${{ github.ref_name }}.zip
